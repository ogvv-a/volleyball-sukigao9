<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY 好き顔 9選 - 🇯🇵龍神NIPPON🏐 ver.</title>
    <style>
        :root {
            --primary-red: #d90429;       /* 日本赤 */
            --primary-darkred: #7a0016;   /* えんじ色 */
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --card-item: #f1f5f9;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-gold: #d97706;
            --japan-black: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-page);
            /* 白黒×日本赤のドットパターン */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(217, 4, 41, 0.05) 0%, transparent 60%),
                radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* 🏐 バレーボール絵文字の薄い背景装飾 */
        body::before {
            content: "🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐";
            position: fixed;
            top: -20px;
            left: -20px;
            width: 120vw;
            height: 120vh;
            font-size: 3rem;
            opacity: 0.04;
            word-break: break-all;
            pointer-events: none;
            line-height: 1.8;
            z-index: 0;
            transform: rotate(-10deg);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 620px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(0,0,0,0.05);
            border-top: 6px solid var(--primary-red);
            text-align: center;
        }

        h1 {
            color: var(--japan-black);
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--primary-red);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .desc-text {
            color: #334155;
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 赤〜えんじ色（日本国旗・代表イメージ）ボタン */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-red), var(--primary-darkred));
            color: #ffffff;
            border: none;
            padding: 16px 38px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 35px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(217, 4, 41, 0.35);
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(217, 4, 41, 0.45);
        }

        .btn-secondary {
            background: #475569;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #334155;
            box-shadow: none;
        }

        /* 選手画像枠（縦長 3:4） */
        .player-image-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 12px;
            overflow: hidden;
            background: #e2e8f0;
            margin-bottom: 8px;
            position: relative;
        }

        .player-image-box svg,
        .player-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 初期画面グリッド */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .player-card {
            background: var(--card-item);
            border-radius: 14px;
            padding: 8px;
            border: 2px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-name {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--japan-black);
        }

        .player-pos {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* 対戦画面 */
        .versus-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 14px;
            margin: 20px 0;
        }

        .vs-card {
            flex: 1;
            background: #ffffff;
            border-radius: 18px;
            padding: 12px;
            cursor: pointer;
            border: 3px solid #e2e8f0;
            transition: all 0.25s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }

        .vs-card:hover {
            border-color: var(--primary-red);
            transform: scale(1.03);
            box-shadow: 0 10px 22px rgba(217, 4, 41, 0.15);
        }

        .vs-card .player-image-box {
            max-height: 280px;
        }

        .vs-divider {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--primary-red);
            font-style: italic;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-red), var(--primary-darkred));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* ランキング結果画面 */
        .ranking-list {
            list-style: none;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            background: var(--card-item);
            padding: 10px 15px;
            border-radius: 14px;
            gap: 15px;
            border: 1px solid #e2e8f0;
        }

        .rank-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #64748b;
            color: #fff;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .rank-1 .rank-badge { background: var(--accent-gold); color: #fff; }
        .rank-2 .rank-badge { background: #94a3b8; color: #fff; }
        .rank-3 .rank-badge { background: #b45309; color: #fff; }

        .rank-info {
            text-align: left;
            flex-grow: 1;
        }

        .rank-name {
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--japan-black);
        }

        .rank-pos {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .rank-image-box {
            width: 48px;
            aspect-ratio: 3 / 4;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            background: #cbd5e1;
        }

        .rank-image-box svg,
        .rank-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- タイトル・サブタイトル -->
        <h1>MY 好き顔 9選</h1>
        <p class="subtitle">🇯🇵龍神NIPPON🏐 ver.</p>

        <!-- HOME SCREEN -->
        <div id="screen-home" class="screen active">
            <!-- 説明文 -->
            <p class="desc-text">
                全46人の選手から、<br>
                あなたの「好き顔」TOP9を決めよう！
            </p>
            <div id="initial-grid" class="grid"></div>
            <div class="btn-group">
                <button class="btn" onclick="startGame()">START</button>
            </div>
        </div>

        <!-- MATCH SCREEN -->
        <div id="screen-match" class="screen">
            <h2 id="match-stage-title" style="color: var(--primary-red); font-size: 1.2rem; font-weight: 800;">2択比較</h2>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="match-counter" style="font-size: 0.85rem; color: var(--text-muted); font-weight: bold;">Match 1</p>

            <div class="versus-wrapper">
                <div id="vs-card-a" class="vs-card" onclick="selectWinner(0)">
                    <div id="vs-avatar-a" class="player-image-box"></div>
                    <div id="vs-name-a" class="player-name">--</div>
                    <div id="vs-pos-a" class="player-pos">--</div>
                </div>

                <div class="vs-divider">VS</div>

                <div id="vs-card-b" class="vs-card" onclick="selectWinner(1)">
                    <div id="vs-avatar-b" class="player-image-box"></div>
                    <div id="vs-name-b" class="player-name">--</div>
                    <div id="vs-pos-b" class="player-pos">--</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="prevStage()">やり直す</button>
            </div>
        </div>

        <!-- FINALISTS SCREEN -->
        <div id="screen-finalists" class="screen">
            <h2 style="color: var(--japan-black);">診断完了！</h2>
            <p class="desc-text" style="margin-top: 15px;">あなただけのTOP9ランキングが決定しました。</p>
            <div class="btn-group">
                <button class="btn" onclick="startFinalRound()">結果を見る</button>
            </div>
        </div>

        <!-- RANKING SCREEN -->
        <div id="screen-ranking" class="screen">
            <h2 style="color: var(--primary-red); font-size: 1.6rem; font-weight: 900;">MY 好き顔 TOP9</h2>
            <ul id="ranking-list" class="ranking-list"></ul>

            <div class="btn-group">
                <button class="btn" onclick="resetGame()">もう一度やり直す</button>
            </div>
        </div>
    </div>

    <script>
        // 日本代表選手データ（拡張用）
        const PLAYERS = [
            { id: 1, name: "石川 祐希", pos: "OH / Cap", num: "14", color: "#d90429" },
            { id: 2, name: "髙橋 藍", pos: "OH", num: "12", color: "#1e3a8a" },
            { id: 3, name: "西田 有志", pos: "OP", num: "1", color: "#111827" },
            { id: 4, name: "山内 晶大", pos: "MB", num: "6", color: "#d90429" },
            { id: 5, name: "小野寺 太志", pos: "MB", num: "2", color: "#1e3a8a" },
            { id: 6, name: "関田 誠大", pos: "S", num: "8", color: "#111827" },
            { id: 7, name: "山本 智大", pos: "L", num: "20", color: "#d90429" },
            { id: 8, name: "宮浦 健人", pos: "OP", num: "4", color: "#1e3a8a" },
            { id: 9, name: "甲斐 優斗", pos: "OH", num: "15", color: "#111827" }
        ];

        let comparisonQueue = [];
        let currentMatchIndex = 0;
        let sortedPlayers = [];
        let currentPair = [];
        let scores = {};

        // ユニフォーム風SVG画像（赤・濃紺・黒）
        function createAvatarSVG(player) {
            if (player.imgSrc) {
                return `<img src="${player.imgSrc}" alt="${player.name}">`;
            }
            return `
                <svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
                    <rect width="300" height="400" fill="#f8fafc"/>
                    <circle cx="150" cy="135" r="75" fill="#1e293b"/>
                    <circle cx="150" cy="150" r="60" fill="#ffedd5"/>
                    <path d="M 50 400 L 85 250 L 215 250 L 250 400 Z" fill="${player.color}"/>
                    <text x="150" y="340" font-size="56" font-weight="900" text-anchor="middle" fill="#ffffff" font-family="sans-serif">${player.num}</text>
                </svg>
            `;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function initHomeScreen() {
            const grid = document.getElementById('initial-grid');
            grid.innerHTML = '';
            PLAYERS.forEach(p => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="player-image-box">${createAvatarSVG(p)}</div>
                    <div class="player-name">${p.name}</div>
                    <div class="player-pos">${p.pos}</div>
                `;
                grid.appendChild(card);
            });
        }

        function generateComparisons() {
            let pairs = [];
            for (let i = 0; i < PLAYERS.length; i++) {
                for (let j = i + 1; j < PLAYERS.length; j++) {
                    pairs.push([PLAYERS[i], PLAYERS[j]]);
                }
            }
            for (let i = pairs.length - 1; i > 0; i--) {
                const r = Math.floor(Math.random() * (i + 1));
                [pairs[i], pairs[r]] = [pairs[r], pairs[i]];
            }
            return pairs.slice(0, 12);
        }

        function startGame() {
            scores = {};
            PLAYERS.forEach(p => scores[p.id] = 0);
            comparisonQueue = generateComparisons();
            currentMatchIndex = 0;
            showScreen('screen-match');
            renderMatch();
        }

        function renderMatch() {
            if (currentMatchIndex >= comparisonQueue.length) {
                showFinalists();
                return;
            }

            const total = comparisonQueue.length;
            const progress = ((currentMatchIndex) / total) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('match-counter').innerText = `Match ${currentMatchIndex + 1} / ${total}`;

            currentPair = comparisonQueue[currentMatchIndex];

            document.getElementById('vs-avatar-a').innerHTML = createAvatarSVG(currentPair[0]);
            document.getElementById('vs-name-a').innerText = currentPair[0].name;
            document.getElementById('vs-pos-a').innerText = currentPair[0].pos;

            document.getElementById('vs-avatar-b').innerHTML = createAvatarSVG(currentPair[1]);
            document.getElementById('vs-name-b').innerText = currentPair[1].name;
            document.getElementById('vs-pos-b').innerText = currentPair[1].pos;
        }

        function selectWinner(selectedIndex) {
            const winner = currentPair[selectedIndex];
            scores[winner.id] += 1;
            currentMatchIndex++;
            renderMatch();
        }

        function prevStage() {
            if (currentMatchIndex > 0) {
                currentMatchIndex--;
                renderMatch();
            } else {
                showScreen('screen-home');
            }
        }

        function showFinalists() {
            showScreen('screen-finalists');
        }

        function startFinalRound() {
            sortedPlayers = [...PLAYERS].sort((a, b) => scores[b.id] - scores[a.id]);
            renderRanking();
            showScreen('screen-ranking');
        }

        function renderRanking() {
            const list = document.getElementById('ranking-list');
            list.innerHTML = '';

            sortedPlayers.forEach((player, idx) => {
                const li = document.createElement('li');
                li.className = `ranking-item rank-${idx + 1}`;
                li.innerHTML = `
                    <div class="rank-badge">${idx + 1}</div>
                    <div class="rank-image-box">${createAvatarSVG(player)}</div>
                    <div class="rank-info">
                        <div class="rank-name">${player.name}</div>
                        <div class="rank-pos">${player.pos}</div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function resetGame() {
            showScreen('screen-home');
        }

        window.onload = function() {
            initHomeScreen();
        };
    </script>
</body>
</html>
