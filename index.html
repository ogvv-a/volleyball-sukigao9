<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUZIGAO 9 - 男子バレーボール日本代表版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .stage-title { color: #667eea; font-size: 24px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 50px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin: 10px; font-weight: bold; letter-spacing: 1px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-small { padding: 10px 25px; font-size: 14px; }
        .players-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .player-card { background: #f8f9fa; border-radius: 15px; padding: 15px; cursor: pointer; transition: all 0.3s; border: 3px solid transparent; }
        .player-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .player-card.selected { border-color: #667eea; background: #e8eaff; }
        .player-card.ranked { border-color: #764ba2; background: #f0e6ff; }
        .player-image { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; display: block; background: #ddd; }
        .player-name { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .player-team { font-size: 12px; color: #666; }
        .instruction { color: #666; font-size: 14px; margin: 20px 0; line-height: 1.6; }
        .progress { color: #999; font-size: 12px; margin-bottom: 15px; }
        .hidden { display: none; }
        .results-list { text-align: left; margin: 20px 0; }
        .result-item { display: flex; align-items: center; padding: 15px; background: #f8f9fa; border-radius: 10px; margin-bottom: 10px; }
        .result-rank { font-size: 20px; font-weight: bold; color: #667eea; width: 40px; text-align: center; }
        .result-image { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin: 0 15px; background: #ddd; }
        .result-info { flex: 1; }
        .result-name { font-size: 16px; font-weight: bold; color: #333; }
        .result-team { font-size: 12px; color: #666; }
        .nav-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        @media (max-width: 480px) { .container { padding: 20px; } h1 { font-size: 24px; } .stage-title { font-size: 20px; } .players-grid { grid-template-columns: 1fr; } }
    </style>
</head>

<div class="container">
<div id="home-screen"><h1>🏐 SUKIGAO 9</h1><p class="subtitle">男子バレーボール日本代表版</p><div style="margin:40px 0"><p class="instruction">46人の選手から、<br><strong>「顔だけ」</strong>で直感的に選んで、<br>あなただけの<strong>TOP9</strong>を決めよう！</p></div><button class="btn" onclick="startGame()">START</button></div>

let currentStage='home', preliminaryGroups=[], preliminaryCurrentGroup=0, preliminaryWinners=[], mainRoundGroups=[], mainRoundCurrentGroup=0, mainRoundRankings=[], mainRoundTempSelections=[], lastBattlePairs=[], lastBattleCurrentPair=0, lastBattleWinners=[], finalists=[], finalRoundPairs=[], finalRoundCurrentPair=0, finalRoundWinners=[];
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function showScreen(id){document.querySelectorAll('.container > div').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function playerCard(p,onClick){const c=document.createElement('div');c.className='player-card';c.innerHTML=`<img src="${p.image}" alt="${p.name}" class="player-image"><div class="player-name">${p.name}</div><div class="player-team">${p.team}</div>`;if(onClick)c.onclick=()=>onClick(p,c);return c}
function startGame(){const s=shuffle(allPlayers);preliminaryGroups=[];preliminaryWinners=[];for(let i=0;i<s.length;i+=4)preliminaryGroups.push(s.slice(i,i+4));preliminaryCurrentGroup=0;currentStage='preliminary';showScreen('preliminary-screen');renderPreliminary()}
function renderPreliminary(){const g=preliminaryGroups[preliminaryCurrentGroup],box=document.getElementById('preliminary-players');box.innerHTML='';document.getElementById('preliminary-progress').textContent=`グループ ${preliminaryCurrentGroup+1} / ${preliminaryGroups.length}`;g.forEach(p=>box.appendChild(playerCard(p,p=>selectPreliminary(p))));document.getElementById('preliminary-prev').disabled=preliminaryCurrentGroup===0}
function selectPreliminary(p){preliminaryWinners[preliminaryCurrentGroup]=p;preliminaryCurrentGroup++;if(preliminaryCurrentGroup>=preliminaryGroups.length)startMainRound();else renderPreliminary()}
function startMainRound(){const s=shuffle(preliminaryWinners);mainRoundGroups=[];mainRoundRankings=[];for(let i=0;i<s.length;i+=4)mainRoundGroups.push(s.slice(i,i+4));mainRoundCurrentGroup=0;mainRoundTempSelections=[];currentStage='main-round';showScreen('main-round-screen');renderMainRound()}
function renderMainRound(){const g=mainRoundGroups[mainRoundCurrentGroup],box=document.getElementById('main-round-players');box.innerHTML='';document.getElementById('main-round-progress').textContent=`グループ ${mainRoundCurrentGroup+1} / ${mainRoundGroups.length}　1位→2位の順にタップ`;g.forEach(p=>box.appendChild(playerCard(p,(p,c)=>selectMainRound(p,c))));document.getElementById('main-round-prev').disabled=mainRoundCurrentGroup===0}
function selectMainRound(p,c){if(mainRoundTempSelections.some(x=>x.id===p.id))return;mainRoundTempSelections.push(p);c.classList.add('ranked');if(mainRoundTempSelections.length===2){mainRoundRankings[mainRoundCurrentGroup]=[...mainRoundTempSelections];mainRoundTempSelections=[];mainRoundCurrentGroup++;if(mainRoundCurrentGroup>=mainRoundGroups.length)startLastBattle();else renderMainRound()}}
function startLastBattle(){const candidates=mainRoundRankings.flat();const s=shuffle(candidates);lastBattlePairs=[];lastBattleWinners=[];for(let i=0;i<s.length;i+=2)lastBattlePairs.push(s.slice(i,i+2));lastBattleCurrentPair=0;currentStage='last-battle';showScreen('last-battle-screen');renderLastBattle()}
function renderLastBattle(){const pair=lastBattlePairs[lastBattleCurrentPair],box=document.getElementById('last-battle-players');box.innerHTML='';document.getElementById('last-battle-progress').textContent=`${lastBattleCurrentPair+1} / ${lastBattlePairs.length}`;pair.forEach(p=>box.appendChild(playerCard(p,p=>selectLastBattle(p))));document.getElementById('last-battle-prev').disabled=lastBattleCurrentPair===0}
function selectLastBattle(p){lastBattleWinners[lastBattleCurrentPair]=p;lastBattleCurrentPair++;if(lastBattleCurrentPair>=lastBattlePairs.length)showFinalists();else renderLastBattle()}
function showFinalists(){finalists=lastBattleWinners.slice(0,18);currentStage='finalists';showScreen('finalists-screen');const box=document.getElementById('finalists-players');box.innerHTML='';finalists.forEach(p=>box.appendChild(playerCard(p)))}
function startFinalRound(){const s=shuffle(finalists);finalRoundPairs=[];finalRoundWinners=[];for(let i=0;i<s.length;i+=2)finalRoundPairs.push(s.slice(i,i+2));finalRoundCurrentPair=0;currentStage='final-round';showScreen('final-round-screen');renderFinalRound()}
function renderFinalRound(){const pair=finalRoundPairs[finalRoundCurrentPair],box=document.getElementById('final-round-players');box.innerHTML='';document.getElementById('final-round-progress').textContent=`${finalRoundCurrentPair+1} / ${finalRoundPairs.length}　この対戦の勝者がTOP9入り`;pair.forEach(p=>box.appendChild(playerCard(p,p=>selectFinalRound(p))));document.getElementById('final-round-prev').disabled=finalRoundCurrentPair===0}
function selectFinalRound(p){finalRoundWinners[finalRoundCurrentPair]=p;finalRoundCurrentPair++;if(finalRoundCurrentPair>=finalRoundPairs.length)showRanking();else renderFinalRound()}
function showRanking(){currentStage='ranking';showScreen('ranking-screen');const box=document.getElementById('ranking-results');box.innerHTML='';finalRoundWinners.forEach((p,i)=>{const d=document.createElement('div');d.className='result-item';d.innerHTML=`<div class="result-rank">${i+1}</div><img src="${p.image}" alt="${p.name}" class="result-image"><div class="result-info"><div class="result-name">${p.name}</div><div class="result-team">${p.team}</div></div>`;box.appendChild(d)})}
function prevStage(){if(currentStage==='preliminary'&&preliminaryCurrentGroup>0){preliminaryCurrentGroup--;preliminaryWinners.splice(preliminaryCurrentGroup,1);renderPreliminary()}else if(currentStage==='main-round'&&mainRoundCurrentGroup>0){mainRoundCurrentGroup--;mainRoundRankings.splice(mainRoundCurrentGroup,1);mainRoundTempSelections=[];renderMainRound()}else if(currentStage==='last-battle'&&lastBattleCurrentPair>0){lastBattleCurrentPair--;lastBattleWinners.splice(lastBattleCurrentPair,1);renderLastBattle()}else if(currentStage==='final-round'&&finalRoundCurrentPair>0){finalRoundCurrentPair--;finalRoundWinners.splice(finalRoundCurrentPair,1);renderFinalRound()}}
