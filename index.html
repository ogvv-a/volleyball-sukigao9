        .screen {

        .vs-card:hover {

            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.15);

        .player-image-box {

        .player-name {

            display: flex;

        /* ボタン群 */

            gap: 8px;

            gap: 8px;

        .btn {

            gap: 10px;
        }

        .all-rank-num {
            font-weight: bold;
            width: 30px;
            color: var(--text-muted);
        }
    </style>
</head>

            { id: 38, name: "山田 大貴", team: "大阪ブルテオン", image: "38.jpg.jpg" },
            { id: 39, name: "牧 大晃", team: "大阪ブルテオン", image: "39.jpg.jpg" },
            { id: 40, name: "竹松 魁柊", team: "ウルフドッグス名古屋", image: "40.jpg.jpg" },
            { id: 41, name: "川野 琢磨", team: "東京グレートベアーズ", image: "41.jpg.jpg" },
            { id: 42, name: "森 愛樹", team: "ジェイテクトSTINGS愛知", image: "42.jpg.jpg" },
            { id: 43, name: "安井 恒介", team: "東京グレートベアーズ", image: "43.jpg.jpg" },
            { id: 44, name: "山本 龍", team: "大韓航空", image: "44.jpg.jpg" },
            { id: 45, name: "柳田 将洋", team: "東京グレートベアーズ", image: "45.jpg.jpg" },
            { id: 46, name: "清水 邦広", team: "大阪ブルテオン", image: "46.jpg.jpg" },
            { id: 47, name: "髙橋 塁", team: "サントリーサンバーズ大阪", image: "47.jpg.jpg" }
        ];

        // -------------------------------------------------------------
        // キャラクターソーター（マージソート回路）の状態変数
        // -------------------------------------------------------------
        let parentList = [];
        let nextParentList = [];
        let curA = [];
        let curB = [];
        let merged = [];
        let historyStack = [];
        let battleCount = 0;
        let totalWorkEstimate = 0;
        let completedWork = 0;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function renderPlayerImage(player) {
            return `<img src="${player.image}" alt="${player.name}">`;
        }

        function startGame() {
            // シャッフル
            let shuffled = [...PLAYERS];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            // マージソート用初期化
            parentList = shuffled.map(p => [p]);
            nextParentList = [];
            curA = [];
            curB = [];
            merged = [];
            historyStack = [];
            battleCount = 0;
            completedWork = 0;

            // 総作業量の概算計算 (N * log2(N))
            totalWorkEstimate = PLAYERS.length * Math.ceil(Math.log2(PLAYERS.length));

            showScreen('screen-match');
            setupNextMerge();
        }

        function saveState() {
            return JSON.stringify({
                parentList: parentList,
                nextParentList: nextParentList,
                curA: curA,
                curB: curB,
                merged: merged,
                battleCount: battleCount,
                completedWork: completedWork
            });
        }

        function restoreState(jsonStr) {
            const state = JSON.parse(jsonStr);
            parentList = state.parentList;
            nextParentList = state.nextParentList;
            curA = state.curA;
            curB = state.curB;
            merged = state.merged;
            battleCount = state.battleCount;
            completedWork = state.completedWork;
        }

        function setupNextMerge() {
            // ソート完了チェック（次ラウンド用nextParentListが空である条件を追加し早期終了バグを修正）
            if (parentList.length === 1 && nextParentList.length === 0 && curA.length === 0 && curB.length === 0) {
                showRankingResult(parentList[0]);
                return;
            }

            if (curA.length === 0 && curB.length === 0) {
                if (parentList.length >= 2) {
                    curA = parentList.shift();
                    curB = parentList.shift();
                    merged = [];
                } else if (parentList.length === 1) {
                    nextParentList.push(parentList.shift());
                    parentList = nextParentList;
                    nextParentList = [];
                    setupNextMerge();
                    return;
                } else {
                    parentList = nextParentList;
                    nextParentList = [];
                    setupNextMerge();
                    return;
                }
            }

            renderCurrentMatch();
        }

        function renderCurrentMatch() {
            document.getElementById('battle-counter').innerText = `Battle #${battleCount + 1}`;
            
            let percent = Math.min(99, Math.floor((completedWork / totalWorkEstimate) * 100));
            document.getElementById('progress-text').innerText = `${percent}% Complete`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            const playerA = curA[0];
            const playerB = curB[0];

            document.getElementById('vs-avatar-a').innerHTML = renderPlayerImage(playerA);
            document.getElementById('vs-name-a').innerText = playerA.name;
            document.getElementById('vs-team-a').innerText = playerA.team;

            document.getElementById('vs-avatar-b').innerHTML = renderPlayerImage(playerB);
            document.getElementById('vs-name-b').innerText = playerB.name;
            document.getElementById('vs-team-b').innerText = playerB.team;

            document.getElementById('btn-undo').disabled = (historyStack.length === 0);
        }

        function selectChoice(type) {
            // 現在の状態を履歴に保存
            historyStack.push(saveState());
            battleCount++;

            // 0: A勝利, 1: B勝利, 2: どちらも好き(引き分け), 3: パス
            if (type === 0) {
                merged.push(curA.shift());
                completedWork++;
            } else if (type === 1) {
                merged.push(curB.shift());
                completedWork++;
            } else if (type === 2 || type === 3) {
                merged.push(curA.shift());
                merged.push(curB.shift());
                completedWork += 2;
            }

            checkSubMergeFinish();
        }

        function checkSubMergeFinish() {
            if (curA.length === 0) {
                merged = merged.concat(curB);
                curB = [];
                nextParentList.push(merged);
                merged = [];
                setupNextMerge();
            } else if (curB.length === 0) {
                merged = merged.concat(curA);
                curA = [];
                nextParentList.push(merged);
                merged = [];
                setupNextMerge();
            } else {
                renderCurrentMatch();
            }
        }

        function undoLastChoice() {
            if (historyStack.length === 0) return;
            const lastState = historyStack.pop();
            restoreState(lastState);
            renderCurrentMatch();
        }

        function showRankingResult(finalSortedList) {
            document.getElementById('progress-text').innerText = `100% Complete`;
            document.getElementById('progress-bar').style.width = `100%`;

            const gridContainer = document.getElementById('ranking-grid');
            gridContainer.innerHTML = '';

            const top9 = finalSortedList.slice(0, 9);
            top9.forEach((player, idx) => {
                const card = document.createElement('div');
                card.className = `rank-card rank-${idx + 1}`;
                card.innerHTML = `
                    <div class="rank-badge">${idx + 1}</div>
                    <div class="player-image-box">${renderPlayerImage(player)}</div>
                    <div class="player-name">${player.name}</div>
                    <div class="player-team">${player.team}</div>
                `;
                gridContainer.appendChild(card);
            });

            // 10位〜46位
            const allListContainer = document.getElementById('all-ranking-list');
            allListContainer.innerHTML = '';
            finalSortedList.forEach((player, idx) => {
                const li = document.createElement('li');
                li.className = 'all-list-item';
                li.innerHTML = `
                    <span class="all-rank-num">${idx + 1}位</span>
                    <strong>${player.name}</strong>
                    <span style="color: var(--text-muted); font-size: 0.8rem; margin-left: auto;">${player.team}</span>
                `;
                allListContainer.appendChild(li);
            });

            showScreen('screen-ranking');
        }

        function resetGame() {
            showScreen('screen-home');
        }
    </script>
</body>
</html>
