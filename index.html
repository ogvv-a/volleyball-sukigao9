<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY 好き顔 9選 - 🇯🇵龍神NIPPON🏐 ver.</title>
    <style>
        :root {
            --primary-red: #d90429;       /* 日本赤 */
            --primary-darkred: #7a0016;   /* えんじ色 */
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --card-item: #f1f5f9;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-gold: #d97706;
            --japan-black: #111827;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-page);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(217, 4, 41, 0.05) 0%, transparent 60%),
                radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* 🏐 バレーボール絵文字の背景装飾 */
        body::before {
            content: "🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐 🏐";
            position: fixed;
            top: -20px;
            left: -20px;
            width: 120vw;
            height: 120vh;
            font-size: 3rem;
            opacity: 0.04;
            word-break: break-all;
            pointer-events: none;
            line-height: 1.8;
            z-index: 0;
            transform: rotate(-10deg);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(0,0,0,0.05);
            border-top: 6px solid var(--primary-red);
            text-align: center;
        }

        h1 {
            color: var(--japan-black);
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--primary-red);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .desc-text {
            color: #334155;
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-red), var(--primary-darkred));
            color: #ffffff;
            border: none;
            padding: 16px 48px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 35px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(217, 4, 41, 0.35);
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(217, 4, 41, 0.45);
        }

        .btn-secondary {
            background: #475569;
            box-shadow: none;
            padding: 12px 28px;
            font-size: 0.95rem;
        }

        .btn-secondary:hover {
            background: #334155;
            box-shadow: none;
        }

        /* 選手画像枠 */
        .player-image-box {
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 12px;
            overflow: hidden;
            background: #e2e8f0;
            margin-bottom: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .player-name {
            font-weight: 800;
            font-size: 1rem;
            color: var(--japan-black);
        }

        .player-team {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* 対戦画面 */
        .versus-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 14px;
            margin: 20px 0;
        }

        .vs-card {
            flex: 1;
            background: #ffffff;
            border-radius: 18px;
            padding: 12px;
            cursor: pointer;
            border: 3px solid #e2e8f0;
            transition: all 0.25s ease;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }

        .vs-card:hover {
            border-color: var(--primary-red);
            transform: scale(1.03);
            box-shadow: 0 10px 22px rgba(217, 4, 41, 0.15);
        }

        .vs-card .player-image-box {
            max-height: 280px;
        }

        .vs-divider {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--primary-red);
            font-style: italic;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-red), var(--primary-darkred));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* ランキング結果画面 */
        .ranking-list {
            list-style: none;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            background: var(--card-item);
            padding: 10px 15px;
            border-radius: 14px;
            gap: 15px;
            border: 1px solid #e2e8f0;
        }

        .rank-badge {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #64748b;
            color: #fff;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .rank-1 .rank-badge { background: var(--accent-gold); color: #fff; }
        .rank-2 .rank-badge { background: #94a3b8; color: #fff; }
        .rank-3 .rank-badge { background: #b45309; color: #fff; }

        .rank-info {
            text-align: left;
            flex-grow: 1;
        }

        .rank-name {
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--japan-black);
        }

        .rank-team {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .rank-image-box {
            width: 48px;
            aspect-ratio: 3 / 4;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            background: #cbd5e1;
        }

        .rank-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- タイトル・サブタイトル -->
        <h1>MY 好き顔 9選</h1>
        <p class="subtitle">🇯🇵龍神NIPPON🏐 ver.</p>

        <!-- HOME SCREEN -->
        <div id="screen-home" class="screen active">
            <p class="desc-text">
                全46人の選手から、<br>
                あなたの「好き顔」TOP9を決めよう！
            </p>
            <div class="btn-group">
                <button class="btn" onclick="startGame()">START</button>
            </div>
        </div>

        <!-- MATCH SCREEN -->
        <div id="screen-match" class="screen">
            <h2 id="match-stage-title" style="color: var(--primary-red); font-size: 1.2rem; font-weight: 800;">2択比較</h2>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="match-counter" style="font-size: 0.85rem; color: var(--text-muted); font-weight: bold;">Match 1</p>

            <div class="versus-wrapper">
                <div id="vs-card-a" class="vs-card" onclick="selectWinner(0)">
                    <div id="vs-avatar-a" class="player-image-box"></div>
                    <div id="vs-name-a" class="player-name">--</div>
                    <div id="vs-team-a" class="player-team">--</div>
                </div>

                <div class="vs-divider">VS</div>

                <div id="vs-card-b" class="vs-card" onclick="selectWinner(1)">
                    <div id="vs-avatar-b" class="player-image-box"></div>
                    <div id="vs-name-b" class="player-name">--</div>
                    <div id="vs-team-b" class="player-team">--</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-secondary" onclick="prevStage()">やり直す</button>
            </div>
        </div>

        <!-- FINALISTS SCREEN -->
        <div id="screen-finalists" class="screen">
            <h2 style="color: var(--japan-black);">診断完了！</h2>
            <p class="desc-text" style="margin-top: 15px;">あなただけのTOP9ランキングが決定しました。</p>
            <div class="btn-group">
                <button class="btn" onclick="startFinalRound()">結果を見る</button>
            </div>
        </div>

        <!-- RANKING SCREEN -->
        <div id="screen-ranking" class="screen">
            <h2 style="color: var(--primary-red); font-size: 1.6rem; font-weight: 900;">MY 好き顔 TOP9</h2>
            <ul id="ranking-list" class="ranking-list"></ul>

            <div class="btn-group">
                <button class="btn" onclick="resetGame()">もう一度やり直す</button>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // ご提示いただいた選手データをそのまま使用
        // -------------------------------------------------------------
        const PLAYERS = [
            { id: 1, name: "西田 有志", team: "大阪ブルテオン", image: "1.jpg.jpg" },
            { id: 2, name: "小野寺 太志", team: "サントリーサンバーズ大阪", image: "2.jpg.jpg" },
            { id: 3, name: "深津 英臣", team: "ウルフドッグス名古屋", image: "3.jpg.jpg" },
            { id: 4, name: "宮浦 健人", team: "ウルフドッグス名古屋", image: "4.jpg.jpg" },
            { id: 5, name: "大塚 達宣", team: "パワーバレー・ミラノ", image: "5.jpg.jpg" },
            { id: 6, name: "山内 晶大", team: "大阪ブルテオン", image: "6.jpg.jpg" },
            { id: 7, name: "新井 雄大", team: "広島サンダーズ", image: "7.jpg.jpg" },
            { id: 8, name: "関田 誠大", team: "ジェイテクトSTINGS愛知", image: "8.jpg.jpg" },
            { id: 9, name: "河東 祐大", team: "ジェイテクトSTINGS愛知", image: "9.jpg.jpg" },
            { id: 10, name: "髙橋 健太郎", team: "ジェイテクトSTINGS愛知", image: "10.jpg.jpg" },
            { id: 11, name: "富田 将馬", team: "大阪ブルテオン", image: "11.jpg.jpg" },
            { id: 12, name: "高橋 藍", team: "ボグダンカ・LUK・ルブリン", image: "12.jpg.jpg" },
            { id: 13, name: "小川 智大", team: "ボグダンカ・LUK・ルブリン", image: "13.jpg.jpg" },
            { id: 14, name: "石川 祐希", team: "ジラート・バンク・アンカラ", image: "14.jpg.jpg" },
            { id: 15, name: "甲斐 優斗", team: "大阪ブルテオン", image: "15.jpg.jpg" },
            { id: 16, name: "村山 豪", team: "大阪ブルテオン", image: "16.jpg.jpg" },
            { id: 17, name: "西本 圭吾", team: "広島サンダーズ", image: "17.jpg.jpg" },
            { id: 18, name: "西山 大翔", team: "大阪ブルテオン", image: "18.jpg.jpg" },
            { id: 19, name: "高橋 和幸", team: "ジェイテクトSTINGS愛知", image: "19.jpg.jpg" },
            { id: 20, name: "山本 智大", team: "大阪ブルテオン", image: "20.jpg.jpg" },
            { id: 21, name: "永露 元稀", team: "ウルフドッグス名古屋", image: "21.jpg.jpg" },
            { id: 22, name: "藤中 颯志", team: "大阪ブルテオン", image: "22.jpg.jpg" },
            { id: 23, name: "エバデダン ラリー", team: "大阪ブルテオン", image: "23.jpg.jpg" },
            { id: 24, name: "高橋 慶帆", team: "ジェイテクトSTINGS愛知", image: "24.jpg.jpg" },
            { id: 25, name: "下川 諒", team: "サントリーサンバーズ大阪", image: "25.jpg.jpg" },
            { id: 26, name: "山崎 彰都", team: "東京グレートベアーズ", image: "26.jpg.jpg" },
            { id: 27, name: "垂水 優芽", team: "アラゴ・セット", image: "27.jpg.jpg" },
            { id: 28, name: "麻野 堅斗", team: "早稲田大学", image: "28.jpg.jpg" },
            { id: 29, name: "三輪 大将", team: "広島サンダーズ", image: "29.jpg.jpg" },
            { id: 30, name: "西川 馨太郎", team: "大阪ブルテオン", image: "30.jpg.jpg" },
            { id: 31, name: "今橋 祐希", team: "ウルフドッグス名古屋", image: "31.jpg.jpg" },
            { id: 32, name: "高木 啓士郎", team: "東京グレートベアーズ", image: "32.jpg.jpg" },
            { id: 34, name: "後藤 陸翔", team: "東京グレートベアーズ", image: "34.jpg.jpg" },
            { id: 35, name: "工藤 有史", team: "信州松本トライデンツ", image: "35.jpg.jpg" },
            { id: 36, name: "水町 泰杜", team: "ウルフドッグス名古屋", image: "36.jpg.jpg" },
            { id: 37, name: "伊藤 吏玖", team: "東京グレートベアーズ", image: "37.jpg.jpg" },
            { id: 38, name: "山田 大貴", team: "大阪ブルテオン", image: "38.jpg.jpg" },
            { id: 39, name: "牧 大晃", team: "大阪ブルテオン", image: "39.jpg.jpg" },
            { id: 40, name: "竹松 魁柊", team: "ウルフドッグス名古屋", image: "40.jpg.jpg" },
            { id: 41, name: "川野 琢磨", team: "東京グレートベアーズ", image: "41.jpg.jpg" },
            { id: 42, name: "森 愛樹", team: "ジェイテクトSTINGS愛知", image: "42.jpg.jpg" },
            { id: 43, name: "安井 恒介", team: "東京グレートベアーズ", image: "43.jpg.jpg" },
            { id: 44, name: "山本 龍", team: "大韓航空", image: "44.jpg.jpg" },
            { id: 45, name: "柳田 将洋", team: "東京グレートベアーズ", image: "45.jpg.jpg" },
            { id: 46, name: "清水 邦広", team: "大阪ブルテオン", image: "46.jpg.jpg" },
            { id: 47, name: "髙橋 塁", team: "サントリーサンバーズ大阪", image: "47.jpg.jpg" }
        ];

        let comparisonQueue = [];
        let currentMatchIndex = 0;
        let sortedPlayers = [];
        let currentPair = [];
        let scores = {};

        function renderPlayerImage(player) {
            return `<img src="${player.image}" alt="${player.name}">`;
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function generateComparisons() {
            let pairs = [];
            for (let i = 0; i < PLAYERS.length; i++) {
                for (let j = i + 1; j < PLAYERS.length; j++) {
                    pairs.push([PLAYERS[i], PLAYERS[j]]);
                }
            }
            for (let i = pairs.length - 1; i > 0; i--) {
                const r = Math.floor(Math.random() * (i + 1));
                [pairs[i], pairs[r]] = [pairs[r], pairs[i]];
            }
            return pairs.slice(0, 15);
        }

        function startGame() {
            scores = {};
            PLAYERS.forEach(p => scores[p.id] = 0);
            comparisonQueue = generateComparisons();
            currentMatchIndex = 0;
            showScreen('screen-match');
            renderMatch();
        }

        function renderMatch() {
            if (currentMatchIndex >= comparisonQueue.length) {
                showFinalists();
                return;
            }

            const total = comparisonQueue.length;
            const progress = ((currentMatchIndex) / total) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('match-counter').innerText = `Match ${currentMatchIndex + 1} / ${total}`;

            currentPair = comparisonQueue[currentMatchIndex];

            document.getElementById('vs-avatar-a').innerHTML = renderPlayerImage(currentPair[0]);
            document.getElementById('vs-name-a').innerText = currentPair[0].name;
            document.getElementById('vs-team-a').innerText = currentPair[0].team;

            document.getElementById('vs-avatar-b').innerHTML = renderPlayerImage(currentPair[1]);
            document.getElementById('vs-name-b').innerText = currentPair[1].name;
            document.getElementById('vs-team-b').innerText = currentPair[1].team;
        }

        function selectWinner(selectedIndex) {
            const winner = currentPair[selectedIndex];
            scores[winner.id] += 1;
            currentMatchIndex++;
            renderMatch();
        }

        function prevStage() {
            if (currentMatchIndex > 0) {
                currentMatchIndex--;
                renderMatch();
            } else {
                showScreen('screen-home');
            }
        }

        function showFinalists() {
            showScreen('screen-finalists');
        }

        function startFinalRound() {
            sortedPlayers = [...PLAYERS].sort((a, b) => scores[b.id] - scores[a.id]);
            renderRanking();
            showScreen('screen-ranking');
        }

        function renderRanking() {
            const list = document.getElementById('ranking-list');
            list.innerHTML = '';

            const top9 = sortedPlayers.slice(0, 9);

            top9.forEach((player, idx) => {
                const li = document.createElement('li');
                li.className = `ranking-item rank-${idx + 1}`;
                li.innerHTML = `
                    <div class="rank-badge">${idx + 1}</div>
                    <div class="rank-image-box">${renderPlayerImage(player)}</div>
                    <div class="rank-info">
                        <div class="rank-name">${player.name}</div>
                        <div class="rank-team">${player.team}</div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function resetGame() {
            showScreen('screen-home');
        }
    </script>
</body>
</html>
